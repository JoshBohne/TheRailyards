<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railyards · Agent dashboard</title><style>
:root{--bg:#f4f3ef;--panel:#fff;--ink:#222;--muted:#666;--line:#ddd;--accent:#2f5d3a;--warn:#9a5b12;--bad:#a33;--track:#e7e5df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2}
h1{font-size:16px;margin:0;font-weight:600}h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
#connection{font-size:12px;color:var(--accent);margin-left:auto}#connection.off{color:var(--bad)}
#note{flex-basis:100%;margin:0;color:#333}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:16px 20px;max-width:1900px;margin:auto}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
/* render status */
#render .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
#render .big{font-size:18px;font-weight:600}.bar{height:10px;background:var(--track);border-radius:5px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.bar.idle i{background:#bbb}.stats{font:12px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ol,ul{margin:0;padding:0;list-style:none}li{padding:6px 0;border-top:1px solid #eee;display:flex;gap:10px;align-items:flex-start}li:first-child{border-top:0}
.k{color:var(--muted);font-size:12px;white-space:nowrap}.grow{flex:1;min-width:0}
/* checklist */
.st{width:18px;height:18px;border-radius:4px;border:1px solid #bbb;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px}
.st.done{background:var(--accent);border-color:var(--accent);color:#fff}.st.doing{border-color:var(--accent);color:var(--accent)}.st.blocked{border-color:var(--bad);color:var(--bad)}
li.done .grow{color:var(--muted);text-decoration:line-through}.ev{font-size:12px;margin-left:6px}
#progress{font-size:12px;color:var(--muted);margin-left:auto}
/* views */
nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;border:1px solid var(--line);background:transparent;color:#444;padding:5px 10px;border-radius:5px;cursor:pointer}
button[aria-pressed=true]{color:#fff;background:#333;border-color:#333}button:disabled{opacity:.4;cursor:default}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}#modes{display:flex;gap:4px}
figure{margin:0;background:var(--track);min-height:260px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:4px;overflow:hidden}
figure img{display:block;width:100%;max-height:calc(100vh - 300px);object-fit:contain}
.compare{position:relative;width:100%}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.compare img.top{clip-path:inset(0 0 0 var(--cut,50%))}
.compare .base{position:relative}.compare input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.compare .handle{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:#fff;box-shadow:0 0 0 1px #0004;pointer-events:none}
.tag{position:absolute;top:8px;padding:2px 8px;border-radius:4px;background:#0009;color:#fff;font-size:11px;pointer-events:none}.tag.l{left:8px}.tag.r{right:8px}
.stale{position:absolute;left:8px;bottom:8px;background:#fff8e6;color:var(--warn);border:1px solid #e9d7a8;padding:3px 8px;border-radius:4px;font-size:12px}
.empty{padding:80px 20px;color:#777;text-align:center}.caption{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
/* versions */
.versions li{flex-direction:column;gap:4px}.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs img{height:54px;border-radius:3px;background:var(--track);cursor:pointer;border:1px solid var(--line)}
code{font:12px ui-monospace,monospace;background:#f1f0ec;padding:1px 4px;border-radius:3px}
/* events */
#events li{font-size:12.5px}#events .kind{width:52px;color:var(--muted);flex:none;text-transform:uppercase;font-size:10px;letter-spacing:.05em;padding-top:3px}#events .error .kind{color:var(--bad)}
#events{max-height:360px;overflow:auto}
@media(max-width:1000px){main{grid-template-columns:1fr}}
</style></head><body>
<header><h1>The Railyards · Agent dashboard</h1><span id="connection">Connecting…</span><p id="note">Loading…</p></header>
<main>
<div class="stack">
 <section id="render"><h2>Now rendering</h2><div class="row"><span class="big" id="r-title">Idle</span><span class="k" id="r-time"></span></div><div class="bar idle"><i id="r-bar" style="width:0"></i></div><div class="stats" id="r-stats"></div></section>
 <section id="viewsec"><h2>Views</h2><nav id="views" aria-label="Camera"></nav>
  <div class="toolbar"><span id="status" class="k"></span><div id="modes" aria-label="Image version"><button data-mode="current" aria-pressed="true">Latest</button><button data-mode="before">Before</button><button data-mode="source">Source</button><button data-mode="compare">Before / after</button></div></div>
  <figure id="figure"><div class="empty">Waiting for the first render…</div></figure><div class="caption"><span id="caption"></span><span>Refreshes every 2.5 s · fixed cameras · native Blender renders</span></div></section>
 <section class="versions"><h2>Version history</h2><ul id="versions"></ul></section>
</div>
<div class="stack">
 <section><h2>Queue</h2><ol id="queue"></ol></section>
 <section><div style="display:flex;align-items:baseline"><h2>Checklist</h2><span id="progress"></span></div><ul id="checklist"></ul></section>
 <section><h2>Activity</h2><ul id="events"></ul></section>
 <section><h2>Recent commits</h2><ul id="git"></ul></section>
</div>
</main>
<script>
const $=s=>document.querySelector(s);let state=null,view=null,mode='current',shownKey='',navKey='',cut=50;
const fmt=s=>s==null?'—':s<60?`${Math.round(s)}s`:`${Math.floor(s/60)}m ${String(Math.round(s%60)).padStart(2,'0')}s`;
const clock=t=>new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const ago=t=>{const d=state.server_time-t;return d<60?`${Math.round(d)}s ago`:d<3600?`${Math.round(d/60)}m ago`:clock(t)};
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k.startsWith('on'))e[k]=v;else e.setAttribute(k,v)}for(const k of kids)e.append(k);return e}
function paintRender(){const ar=state.active_render,bar=$('#r-bar');
 if(!ar){$('#r-title').textContent='Idle';$('#r-time').textContent=state.queue.length?`${state.queue.length} queued`:'';bar.style.width='0';bar.parentElement.classList.add('idle');$('#r-stats').textContent='';return}
 bar.parentElement.classList.remove('idle');const p=ar.progress||0;bar.style.width=`${Math.round(p*100)}%`;
 $('#r-title').textContent=ar.label;$('#r-time').textContent=`${Math.round(p*100)}% · ${fmt(ar.elapsed_seconds)} elapsed · ~${fmt(ar.remaining_seconds)} left`+(ar.expected_seconds?` · usually ${fmt(ar.expected_seconds)}`:'');
 $('#r-stats').textContent=ar.stats||(ar.blend?ar.blend:'')}
function paintQueue(){const q=state.queue;$('#queue').replaceChildren(...(q.length?q.map((item,i)=>el('li',{},el('span',{class:'k'},`${i+1}.`),el('span',{class:'grow'},item.label),el('span',{class:'k'},item.expected_seconds?`~${fmt(item.expected_seconds)}`:''))):[el('li',{class:'k'},'Nothing queued')]));
 const total=q.reduce((a,b)=>a+(b.expected_seconds||0),0);if(total)$('#queue').append(el('li',{class:'k'},`≈ ${fmt(total)} of rendering ahead`))}
function paintChecklist(){const c=state.checklist,done=c.filter(t=>t.status==='done').length;$('#progress').textContent=c.length?`${done} / ${c.length} done`:'';
 const mark={todo:'',doing:'›',done:'✓',blocked:'!'};$('#checklist').replaceChildren(...(c.length?c.map(t=>el('li',{class:t.status},el('span',{class:'st '+t.status},mark[t.status]),el('span',{class:'grow'},t.text,t.evidence?el('a',{class:'ev',href:`/evidence/${t.id}`,target:'_blank'},'evidence'):''),el('span',{class:'k'},ago(t.updated_at)))):[el('li',{class:'k'},'No tasks yet')]))}
function paintViews(){const keys=Object.keys(state.views);if(!keys.length){$('#views').replaceChildren();$('#figure').replaceChildren(el('div',{class:'empty'},'No views published yet.'));return}
 if(!view||!state.views[view])view=keys[0];const nk=JSON.stringify(keys.map(k=>[k,state.views[k].label,state.views[k].stale]));
 if(nk!==navKey||true){navKey=nk;$('#views').replaceChildren(...keys.map(k=>{const v=state.views[k];const b=el('button',{'aria-pressed':String(view===k),onclick:()=>{view=k;shownKey='';paintViews()}},v.label+(v.stale?' ⟳':''));return b}))}
 const entry=state.views[view];$('#status').textContent=entry.status||'';
 for(const b of document.querySelectorAll('[data-mode]')){const m=b.dataset.mode;b.setAttribute('aria-pressed',String(mode===m));b.disabled=m==='compare'?!(entry.current&&entry.before):!entry[m]}
 if(mode==='compare'&&!(entry.current&&entry.before))mode='current';if(mode!=='compare'&&!entry[mode])mode='current';
 const fig=$('#figure');
 if(mode==='compare'){const key=`c|${view}|${entry.current.modified}|${entry.before.modified}`;if(key!==shownKey){shownKey=key;
   const base=el('img',{class:'base',src:`/image/${view}/before?t=${entry.before.modified}`,alt:'before'}),top=el('img',{class:'top',src:`/image/${view}/current?t=${entry.current.modified}`,alt:'after'});
   const wrap=el('div',{class:'compare'},base,top,el('span',{class:'tag l'},'Before'),el('span',{class:'tag r'},'After'),el('div',{class:'handle'}));
   const r=el('input',{type:'range',min:0,max:100,value:cut});r.oninput=()=>{cut=r.value;wrap.style.setProperty('--cut',cut+'%')};wrap.style.setProperty('--cut',cut+'%');wrap.append(r);
   fig.replaceChildren(wrap);if(entry.stale)fig.append(el('span',{class:'stale'},'Stale — a newer render is in progress'))}
   $('#caption').textContent=`${entry.label} · ${entry.before.label} → ${entry.current.label}`;return}
 const image=entry[mode];if(!image){shownKey='';fig.replaceChildren(el('div',{class:'empty'},mode==='current'?'Rendering this view…':'No matching image for this camera.'));$('#caption').textContent='';return}
 const url=`/image/${view}/${mode}?t=${image.modified}`;if(url!==shownKey){const next=new Image();next.onload=()=>{shownKey=url;fig.replaceChildren(next);if(entry.stale&&mode==='current')fig.append(el('span',{class:'stale'},'Stale — a newer render is in progress'))};next.alt=`${entry.label} — ${mode}`;next.src=url}
 $('#caption').textContent=`${entry.label} · ${image.label} · ${image.name} · saved ${clock(image.modified)}`}
function paintVersions(){const vs=[...state.versions].reverse();$('#versions').replaceChildren(...(vs.length?vs.map(v=>el('li',{},el('div',{class:'row'},el('b',{},v.label),' ',el('span',{class:'k'},clock(v.time)),v.commit?el('span',{},' ',el('code',{},v.commit)):'',v.blend?el('span',{class:'k'},' · '+v.blend):''),v.note?el('div',{class:'k'},v.note):'',
  el('div',{class:'thumbs'},...v.views.map(k=>el('img',{src:`/version/${v.id}/${k}`,title:`${v.label} · ${k}`,loading:'lazy',onclick:()=>window.open(`/version/${v.id}/${k}`)}))))):[el('li',{class:'k'},'No snapshots yet — agents run dash.py version snapshot after each bounded edit')]))}
function paintEvents(){const ev=[...state.events].reverse().slice(0,80);$('#events').replaceChildren(...(ev.length?ev.map(e=>el('li',{class:e.kind},el('span',{class:'kind'},e.kind),el('span',{class:'grow'},e.text),el('span',{class:'k'},clock(e.time)))):[el('li',{class:'k'},'Quiet so far')]))}
function paintGit(){$('#git').replaceChildren(...(state.git||[]).map(c=>el('li',{},el('code',{},c.hash),el('span',{class:'grow'},c.subject),el('span',{class:'k'},ago(c.time)))))}
function paint(){$('#note').textContent=state.note||'';paintRender();paintQueue();paintChecklist();paintViews();paintVersions();paintEvents();paintGit()}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;shownKey='';paintViews()};
async function poll(){try{const r=await fetch('/state',{cache:'no-store'});state=await r.json();$('#connection').textContent='● Live';$('#connection').className='';paint()}catch{$('#connection').textContent='Dashboard server unavailable';$('#connection').className='off'}}
poll();setInterval(poll,2500);
</script></body></html>
