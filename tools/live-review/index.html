<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Railyards · Live review</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#222;font:15px system-ui,sans-serif}header{padding:18px 24px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0;font-weight:600}#connection{font-size:12px;color:#416246;margin-left:auto}nav{display:flex;gap:5px;flex-wrap:wrap}button{font:inherit;border:1px solid transparent;background:transparent;color:#555;padding:8px 12px;border-radius:5px;cursor:pointer}button[aria-pressed=true]{color:#fff;background:#333}main{max-width:1700px;margin:auto;padding:20px 24px}.bar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:14px}.bar p{margin:0;color:#555;font-size:13px}#note{font-size:15px;color:#222;max-width:900px;line-height:1.5}#status{color:#795321;margin-top:6px}figure{margin:0;background:#e7e5df;min-height:240px;display:flex;align-items:center;justify-content:center}img{display:block;width:100%;max-height:calc(100vh - 220px);object-fit:contain}footer{display:flex;justify-content:space-between;gap:20px;padding-top:10px;font-size:12px;color:#666}#modes{display:flex;gap:4px;white-space:nowrap}#modes button{font-size:13px;border-color:#ddd}.empty{padding:90px;color:#777}@media(max-width:700px){header,main{padding:12px}.bar{display:block}#modes{margin-top:10px}img{max-height:none}footer{display:block}}
</style></head><body><header><h1>The Railyards · Live review</h1><nav id="views" aria-label="Camera"></nav><span id="connection">Connecting…</span></header><main><div class="bar"><div><p id="note">Loading the current model review…</p><p id="status"></p></div><div id="modes" aria-label="Image version"><button data-mode="current" aria-pressed="true">Latest</button><button data-mode="before" aria-pressed="false">Before</button><button data-mode="source" aria-pressed="false">Source</button></div></div><figure><img id="frame" alt="Current stadium render" hidden><div class="empty" id="empty">Waiting for the first render…</div></figure><footer><span id="caption"></span><span>Refreshes automatically · Fixed cameras · Native Blender renders</span></footer></main><script>
let state,view='tower',mode='current',shown='',navKey='';const frame=document.querySelector('#frame');
function paint(){if(!state)return;const entry=state.views[view];document.querySelector('#note').textContent=state.note;document.querySelector('#status').textContent=entry.status||'';const nextNav=JSON.stringify([view,Object.entries(state.views).map(([k,v])=>[k,v.label])]);if(nextNav!==navKey){navKey=nextNav;document.querySelector('#views').replaceChildren(...Object.entries(state.views).map(([key,item])=>{const b=document.createElement('button');b.textContent=item.label;b.setAttribute('aria-pressed',String(view===key));b.onclick=()=>{view=key;paint()};return b}));}for(const b of document.querySelectorAll('[data-mode]')){b.setAttribute('aria-pressed',String(mode===b.dataset.mode));b.disabled=!entry[b.dataset.mode]}
const image=entry[mode];if(!image){frame.hidden=true;document.querySelector('#empty').hidden=false;document.querySelector('#empty').textContent=mode==='current'?'Rendering this correction…':'No matching image for this camera.';return}
const url=`/image/${view}/${mode}?t=${image.modified}`;if(url!==shown){const next=new Image();next.onload=()=>{frame.src=url;frame.alt=entry.label+' — '+mode;frame.hidden=false;document.querySelector('#empty').hidden=true;shown=url};next.src=url}
document.querySelector('#caption').textContent=`${entry.label} · ${image.label} · ${new Date(image.modified*1000).toLocaleTimeString()}`}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>{mode=b.dataset.mode;paint()};async function poll(){try{const response=await fetch('/manifest',{cache:'no-store'});state=await response.json();document.querySelector('#connection').textContent='● Live';paint()}catch{document.querySelector('#connection').textContent='Review server unavailable'}}poll();setInterval(poll,2500);
</script></body></html>
