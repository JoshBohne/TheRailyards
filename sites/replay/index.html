<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Watch an imagined White Sox home run reach the Chicago River. Replay it from a modeled seat, the boat, or the ball's flight."><link rel="icon" href="data:,"><title>Into the River · The Railyards</title></head>
<body>
<main class="experience" id="experience">
  <div id="viewport" role="img" aria-label="Interactive Railyards stadium replay. Use the camera and playback controls to explore."></div>
  <header><a class="brand" href="../index.html" target="_top">THE RAILYARDS <span>← MAIN SITE</span></a><button id="fullscreen" class="quiet">Fullscreen</button></header>
  <div id="loading" role="status"><p id="loading-status">Loading the stadium…</p><progress id="load-progress" max="100" value="0"></progress><a href="../index.html" target="_top">Watch the night-game film</a></div>
  <aside id="camera-panel" class="panel" aria-label="Choose your view">
    <div class="panel-title"><h2>Your view</h2></div>
    <div id="view-options">    <div class="picker-modes" role="group" aria-label="Explore by seat or view"><button id="choose-seat" aria-pressed="false" aria-controls="seat-picker">Pick your seat</button><button id="choose-view" aria-pressed="true" aria-controls="camera-presets">Pick your view</button></div><div id="camera-presets"><div class="view-list" role="group" aria-label="Camera perspectives">
      <button data-camera="overview" aria-pressed="true">The whole flight <span>Aerial</span></button>
<button data-camera="upper" aria-pressed="false">Above the diamond <span>Upper deck</span></button>
<button data-camera="boat" aria-pressed="false">On the river <span>Boat level</span></button>
<button data-camera="follow" aria-pressed="false">Follow the ball <span>Chase camera</span></button>
</div><details class="more-views"><summary>More viewpoints</summary><div class="view-list"><button data-camera="home" aria-pressed="false">Behind the plate <span>Lower bowl</span></button>
<button data-camera="left_center" aria-pressed="false">Left-center terrace <span>Field reveal</span></button>
<button data-camera="arrival" aria-pressed="false">Off Roosevelt <span>Moving approach</span></button>
<button data-camera="riverwalk" aria-pressed="false">Along the riverwalk <span>Arches + waterfront</span></button></div></details>

    </div><div id="seat-picker" hidden>
      <canvas id="seat-map" width="500" height="360" aria-label="Modeled seating map. Tier, row and seat selectors provide a keyboard alternative."></canvas>
      <div class="seat-controls"><label>Tier<select id="tier"><option value="0">Lower bowl</option><option value="1">Club</option><option value="2">Middle</option><option value="3">Upper deck</option><option value="4">Outfield</option></select></label><label>Row<select id="row"></select></label><label>Seat<select id="seat"></select></label></div>
    </div>
    <details class="display-options"><summary>Display</summary><label class="toggle"><input id="track-ball" type="checkbox" checked>Follow the play</label>
    <label class="toggle"><input id="show-trail" type="checkbox" checked>Trail + ball locator</label>
    <label class="toggle"><input id="crowd" type="checkbox" checked>Crowd</label>
</details></div>
  </aside>
  <section class="transport" aria-label="Replay controls">
    <div class="time-heading"><span id="beat" aria-live="off">The pitch</span><span id="clock">0.0 / 10.5 s</span></div>
    <label class="sr-only" for="timeline">Replay time</label><input id="timeline" type="range" min="0" max="10.5" step="0.01" value="0">
    <div class="playback"><button id="play" class="primary" aria-label="Play" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="play-icon" d="m9 5 10 7-10 7Z" fill="currentColor"/><path class="pause-icon" d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3"/></svg></button></div>
  </section>
  <div id="toast" role="status"></div>
</main><script type="module" src="/src/main.ts"></script></body></html>
